<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Half-pixel raster shift</title>
  <desc id="desc">Two 10 meter raster grids in EPSG 32654 contain the same array values, but the second grid starts five meters east, producing a half-pixel offset detected by GeoDebug GEO404.</desc>
  <defs>
    <pattern id="gridA" width="52" height="52" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="#0f1720"/>
      <path d="M52 0H0V52" fill="none" stroke="#5b7083" stroke-width="1"/>
    </pattern>
    <pattern id="gridB" width="52" height="52" patternUnits="userSpaceOnUse" x="26">
      <rect width="52" height="52" fill="#0f1720"/>
      <path d="M52 0H0V52" fill="none" stroke="#5b7083" stroke-width="1"/>
    </pattern>
    <linearGradient id="cellA" x1="0" x2="1">
      <stop offset="0" stop-color="#1f9d76"/>
      <stop offset="1" stop-color="#268bd2"/>
    </linearGradient>
    <style>
      .bg { fill:#071018; }
      .panel { fill:#0b1620; stroke:#223444; stroke-width:1.5; }
      .title { fill:#f4f7fa; font:700 28px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .label { fill:#d9e2ea; font:600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .meta { fill:#9fb0bf; font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .good { fill:#7ee787; font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .bad { fill:#ff7b72; font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .small { fill:#94a7b8; font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" class="bg" rx="18"/>
  <text x="44" y="52" class="title">same CRS. same resolution. wrong grid.</text>
  <text x="44" y="82" class="meta">Case 03 · EPSG:32654 · 10 m pixels · 32 × 32 · identical array values</text>

  <rect x="44" y="108" width="430" height="238" rx="14" class="panel"/>
  <text x="66" y="140" class="label">reference.tif</text>
  <text x="66" y="165" class="meta">origin x = 388400 m</text>
  <rect x="66" y="184" width="364" height="130" fill="url(#gridA)" stroke="#6e879a" stroke-width="1.5"/>
  <rect x="66" y="184" width="52" height="52" fill="#1f9d76" opacity=".72"/>
  <rect x="118" y="184" width="52" height="52" fill="#4db36d" opacity=".72"/>
  <rect x="170" y="184" width="52" height="52" fill="#77b255" opacity=".72"/>
  <rect x="222" y="184" width="52" height="52" fill="#c2b541" opacity=".72"/>
  <rect x="274" y="184" width="52" height="52" fill="#55a868" opacity=".72"/>
  <rect x="326" y="184" width="52" height="52" fill="#2b8cbe" opacity=".72"/>
  <rect x="378" y="184" width="52" height="52" fill="#2166ac" opacity=".72"/>
  <text x="66" y="335" class="small">pixel lattice: x = 388400 + 10n</text>

  <rect x="726" y="108" width="430" height="238" rx="14" class="panel"/>
  <text x="748" y="140" class="label">candidate.tif</text>
  <text x="748" y="165" class="meta">origin x = 388405 m</text>
  <rect x="774" y="184" width="364" height="130" fill="url(#gridB)" stroke="#6e879a" stroke-width="1.5"/>
  <rect x="774" y="184" width="52" height="52" fill="#1f9d76" opacity=".72"/>
  <rect x="826" y="184" width="52" height="52" fill="#4db36d" opacity=".72"/>
  <rect x="878" y="184" width="52" height="52" fill="#77b255" opacity=".72"/>
  <rect x="930" y="184" width="52" height="52" fill="#c2b541" opacity=".72"/>
  <rect x="982" y="184" width="52" height="52" fill="#55a868" opacity=".72"/>
  <rect x="1034" y="184" width="52" height="52" fill="#2b8cbe" opacity=".72"/>
  <rect x="1086" y="184" width="52" height="52" fill="#2166ac" opacity=".72"/>
  <text x="748" y="335" class="small">pixel lattice: x = 388405 + 10n</text>

  <line x1="502" y1="236" x2="698" y2="236" stroke="#ff7b72" stroke-width="2.5"/>
  <path d="M698 236l-12-8v16z" fill="#ff7b72"/>
  <text x="540" y="218" class="bad">+5 m = 0.5 pixel</text>
  <text x="542" y="260" class="meta">arrays line up</text>
  <text x="528" y="282" class="meta">footprints do not</text>

  <rect x="44" y="365" width="1112" height="34" rx="8" fill="#0d1a24" stroke="#223444"/>
  <text x="62" y="388" class="good">✓ same CRS   ✓ same shape   ✓ same resolution   ✓ mean abs pixel diff = 0.0</text>
  <text x="875" y="388" class="bad">GEO404 · grid offset 0.5 px</text>
</svg>