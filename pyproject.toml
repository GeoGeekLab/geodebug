[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geodebug"
version = "0.1.0.dev0"
description = "Deterministic diagnostics for geospatial data and workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GeoGeekLab" }]
dependencies = [
  "pydantic>=2.9,<3",
  "pyproj>=3.6,<4",
  "rich>=13.9,<15",
  "shapely>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
vector = ["pyogrio>=0.10,<1"]
raster = ["rasterio>=1.4,<2"]
parquet = ["pyarrow>=17,<30"]
geopandas = ["geopandas>=1.0,<2"]
all = [
  "geopandas>=1.0,<2",
  "pyarrow>=17,<30",
  "pyogrio>=0.10,<1",
  "rasterio>=1.4,<2",
]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
geodebug = "geodebug.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geodebug"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["geodebug"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["geodebug"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyarrow.*", "pyogrio.*", "rasterio.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geodebug"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
