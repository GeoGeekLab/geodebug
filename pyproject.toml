[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geodebug"
version = "0.0.1.dev0"
description = "Deterministic diagnostics for geospatial data and workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GeoGeekLab" }]
dependencies = [
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
geodebug = "geodebug.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geodebug"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["geodebug"]

[tool.coverage.run]
source = ["geodebug"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
