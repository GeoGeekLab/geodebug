name: Build brand assets

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_social_preview.py"
      - ".github/workflows/brand-assets.yml"
      - "assets/geomole.png"

permissions:
  contents: write

jobs:
  social-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build social preview
        run: python scripts/build_social_preview.py

      - name: Verify JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("assets/geodebug-social-preview.jpg")
          with Image.open(path) as image:
              assert image.format == "JPEG"
              assert image.size == (640, 320)
              image.verify()

          print(f"{path} OK")
          PY

      - name: Commit generated asset
        shell: bash
        run: |
          if git diff --quiet -- assets/geodebug-social-preview.jpg; then
            echo "Social preview is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/geodebug-social-preview.jpg
          git commit -m "brand: rebuild social preview"
          git push
