name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Verify tag matches package version
        run: |
          VERSION="$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("src/geodebug/version.py").read_text()
          match = re.search(r'__version__ = "([^"]+)"', text)
          if match is None:
              raise SystemExit("package version not found")
          print(match.group(1))
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload distributions for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geodebug
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
